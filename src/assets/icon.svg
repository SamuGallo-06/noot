<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;anthropic-sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Icona skeuomorfica quadrata per l'app Noot: sfondo blu con angoli leggermente arrotondati, un pinguino stile Tux di Linux in primo piano, con un iPhone davanti a lui collegato da un cavo di sincronizzazione allo schermo.</desc>
